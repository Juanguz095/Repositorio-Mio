<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TutorIA · Captura académica</title>
<style>body{font:16px system-ui;background:#f4f7fb;color:#15243b;max-width:650px;margin:40px auto;padding:20px}form{background:white;padding:24px;border-radius:16px}label{display:block;margin-top:16px}input,select,button{box-sizing:border-box;width:100%;padding:12px;margin-top:6px;border:1px solid #a8b7ca;border-radius:8px;font:inherit}button{background:#184c8c;color:white;margin-top:24px}p{line-height:1.5}</style></head>
<body><h1>Captura académica</h1><p>Demostración con datos sintéticos. El envío registra una observación; la publicación requiere revisión humana.</p>
<form method="post" action="">
<label>Identificador del envío <input name="event_id" required maxlength="128" pattern="[A-Za-z0-9_.:-]+" placeholder="form-20242-001"></label>
<label>Código sintético del alumno <input name="alumno_id" required maxlength="80" placeholder="SYN-0900"></label>
<label>Periodo de observación <input type="number" name="periodo" required min="1" step="1" value="20242"></label>
<label>Asistencia (0–1) <input type="number" name="asistencia" min="0" max="1" step="0.01"></label>
<label>Promedio (0–20) <input type="number" name="promedio" min="0" max="20" step="0.1"></label>
<label>Créditos aprobados <input type="number" name="creditos_aprobados" min="0" max="40" step="1"></label>
<label>Matrícula en la fecha de observación <select name="matriculado"><option value="">Sin dato</option><option value="1">Matriculado</option><option value="0">No matriculado</option></select></label>
<label>Pagos al día en la fecha de observación <select name="pagos_al_dia"><option value="">Sin dato o no aplica</option><option value="1">Sí</option><option value="0">No</option></select></label>
<button type="submit">Registrar observación</button></form></body></html>
